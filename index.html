<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban Board</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="icon" type="image/svg+xml" href="/assets/kanban.svg">
</head>

<body>
  <div class="header">
    <h1>Interactive Kanban Board</h1>
    <label class="switch">
      <input type="checkbox" id="darkModeToggle">
      <span class="slider">
        <i class="bi bi-moon-fill"></i>
        <i class="bi bi-sun-fill"></i>
      </span>
    </label>
  </div>

  <div class="form-container">
    <input type="text" id="titulo" placeholder="Ticket title">
    <select id="prioridad">
      <option value="High">High</option>
      <option value="Medium">Medium</option>
      <option value="Low">Low</option>
    </select>

    <button onclick="crearTicket()" class="btn-crear">
      <i class="bi bi-plus-circle"></i>
       Add Task
    </button>

    <select id="filtro" onchange="aplicarFiltro()">
      <option value="Todos">Filter: All</option>
      <option value="High">High</option>
      <option value="Medium">Medium</option>
      <option value="Low">Low</option>
    </select>
  </div>

  <div class="kanban">
    <div class="column" id="todo">
      <h2>To Do (0)</h2>
    </div>

    <div class="column" id="inprogress">
      <h2>In Progress (0)</h2>
      <div class="limit-message" id="limitMessage">
         Límite alcanzado: 5 tickets
      </div>
    </div>
    
    <div class="column" id="done">
      <h2>Done (0)</h2>
    </div>
  </div>

  <button id="clearBoardBtn" onclick="borrarTodo()">
    <i class="bi bi-trash"></i>
  </button>

  <script src="main.js"></script>
</body>
</html>
